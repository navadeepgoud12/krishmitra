<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyze Disease - KrishMitra 🌾</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='hero.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='analyze.css') }}">
</head>
<body>

<!-- 🔝 Navbar -->
<nav class="navbar">
    <div class="logo"><a href="{{ url_for('home') }}" style="color: inherit; text-decoration: none;">🌱 KrishMitra</a></div>
    <ul>
        <li><a href="{{ url_for('home') }}">Dashboard</a></li>
        <li><a href="{{ url_for('predict') }}">Predict</a></li>
        <li><a href="{{ url_for('analyze') }}" class="active">Analyze</a></li>
        <li><a href="{{ url_for('weather') }}">Weather</a></li>
        <li><a href="{{ url_for('market') }}">Market</a></li>
        <li><a href="{{ url_for('schemes') }}">Schemes</a></li>
    </ul>
</nav>

<!-- 🔍 Analyze Section -->
<section class="hero">
    <div class="overlay"></div>
    <div class="content">
        <h1>🔍 Analyze Crop Disease</h1>
        <p>Upload crop images for disease detection</p>
    </div>
</section>

<!-- Form Section -->
<section style="padding: 60px 20px; background: #f9f9f9; min-height: 100vh;">
    <div class="form-container">
        <h3 style="text-align: center;">Upload Crop Image</h3>
        <form id="analyzeForm">
            <input type="text" placeholder="Crop Type" id="cropType" required>
            <input type="file" id="cropImage" accept="image/*" required>
            <button type="submit">Analyze</button>
        </form>
        <div id="result"></div>
    </div>
</section>

<!-- JavaScript Files -->
<script src="{{ url_for('static', filename='utility.js') }}"></script>
<script src="{{ url_for('static', filename='main.js') }}"></script>
<script src="{{ url_for('static', filename='analyze.js') }}"></script>

</body>
</html>
