<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Yield - KrishMitra 🌾</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='hero.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='predict.css') }}">
</head>
<body>

<!-- 🔝 Navbar -->
<nav class="navbar">
    <div class="logo"><a href="{{ url_for('home') }}" style="color: inherit; text-decoration: none;">🌱 KrishMitra</a></div>
    <ul>
        <li><a href="{{ url_for('home') }}">Dashboard</a></li>
        <li><a href="{{ url_for('predict') }}" class="active">Predict</a></li>
        <li><a href="{{ url_for('analyze') }}">Analyze</a></li>
        <li><a href="{{ url_for('weather') }}">Weather</a></li>
        <li><a href="{{ url_for('market') }}">Market</a></li>
        <li><a href="{{ url_for('schemes') }}">Schemes</a></li>
    </ul>
</nav>

<!-- 📈 Predict Section -->
<section class="hero">
    <div class="overlay"></div>
    <div class="content">
        <h1>📈 Predict Crop Yield</h1>
        <p>Use AI to forecast your harvest</p>
    </div>
</section>

<!-- Form Section -->
<section style="padding: 60px 20px; background: #f9f9f9; min-height: 100vh;">
    <div class="form-container">
        <h3>Enter Crop Details</h3>
        <form id="predictForm">

    <!-- Crop -->
    <select name="Crop" required>
        <option value="">Select Crop</option>
        <option value="Rice">Rice</option>
        <option value="Wheat">Wheat</option>
        <option value="Maize">Maize</option>
        <option value="Sugarcane">Sugarcane</option>
        <option value="Cotton">Cotton</option>
    </select>

    <!-- Crop Year -->
    <input type="number" 
           name="Crop_Year" 
           placeholder="Crop Year (e.g., 2020)" 
           required>

    <!-- Season -->
    <select name="Season" required>
        <option value="">Select Season</option>
        <option value="Kharif">Kharif</option>
        <option value="Rabi">Rabi</option>
        <option value="Summer">Summer</option>
        <option value="Whole Year">Whole Year</option>
    </select>

    <!-- State -->
    <select name="State" required>
        <option value="">Select State</option>
        <option value="Andhra Pradesh">Andhra Pradesh</option>
        <option value="Telangana">Telangana</option>
        <option value="Karnataka">Karnataka</option>
        <option value="Tamil Nadu">Tamil Nadu</option>
        <option value="Maharashtra">Maharashtra</option>
    </select>

    <!-- Area -->
    <input type="number" 
           step="0.5"
           name="Area" 
           placeholder="Area (hectares)" 
           required>

    <!-- Rainfall -->
    <input type="number" 
           step="0.1"
           name="Annual_Rainfall" 
           placeholder="Annual Rainfall (mm)" 
           required>

    <!-- Fertilizer -->
    <input type="number" 
           step="10"
           name="Fertilizer" 
           placeholder="Fertilizer Used (kg)" 
           required>

    <!-- Pesticide -->
    <input type="number" 
           step="10"
           name="Pesticide" 
           placeholder="Pesticide Used (kg)" 
           required>

    <!-- Avg Temperature -->
    <input type="number" 
           step="1"
           name="Avg_Temperature" 
           placeholder="Average Temperature (°C)" 
           required>

    <!-- Max Temperature -->
    <input type="number" 
           step="1"
           name="Max_Temperature" 
           placeholder="Max Temperature (°C)" 
           required>

    <!-- Min Temperature -->
    <input type="number" 
           step="1"
           name="Min_Temperature" 
           placeholder="Min Temperature (°C)" 
           required>

    <!-- Submit -->
    <button type="submit">Predict Yield 🌾</button>

</form>
        <div id="result"></div>
    </div>
</section>

<!-- JavaScript Files -->
<script src="{{ url_for('static', filename='utility.js') }}"></script>
<script src="{{ url_for('static', filename='main.js') }}"></script>
<script src="{{ url_for('static', filename='predict.js') }}"></script>

</body>
</html>
